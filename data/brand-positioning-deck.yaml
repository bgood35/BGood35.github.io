- src: /deck/slide-01.png
  alt: "Title slide for “Brand Positioning is a Verb”: treating a brand position as a dynamic financial asset that must be supported, and assessing the risk of underinvesting in it based on marketplace conditions."
- src: /deck/slide-02.png
  alt: "Slide titled “Five things settled. One thing not.” listing five points of agreement between Byron Sharp and Mark Ritson on brand consistency, mental availability, distinctive assets, mass marketing, and brand purpose, with positioning identified as the one unsettled question."
- src: /deck/slide-03.png
  alt: "Table titled “Brand positioning's value has been identified and articulated through research that has nothing to do with marketing,” citing findings from George Miller, Eleanor Rosch, Tversky & Kahneman, Chamberlin & Robinson, and Donald Hebb."
- src: /deck/slide-04.png
  alt: "Chart and callout titled “Marketing research has measured the impact of Hebb's findings, but misunderstood it as a capacity problem and not a ‘wiring’ one,” showing message recall dropping as more messages are added to a campaign."
- src: /deck/slide-05.png
  alt: "Slide titled “Brand positioning is built through repetition of a pattern,” comparing positions embedded in the organization versus positions merely applied to it, with signaling-theory citations from Spence, Schelling, and Zahavi."
- src: /deck/slide-06.png
  alt: "Circular diagram mapping six marketing practitioners — Sharp, Sutherland, Ritson, Veselinovic, Porter/Martin/Barney, and Joachimsthaler — to varying depths of brand position, alongside a table of what each perspective leaves unaccounted for."
- src: /deck/slide-07.png
  alt: "Table titled “The practitioners' arguments can be stacked on top of one another,” ranking Sharp, Sutherland, Ritson, Veselinovic, Porter/Martin/Barney, and Joachimsthaler by how deeply their view of positioning is embedded in the organization."
- src: /deck/slide-08.png
  alt: "Table mapping six depths of brand position — demand space, business strategy, product, differentiation, perception, and distinction — to real-world examples (OpenAI, Costco, David, Volvo, Prime, Coca-Cola), audience, positioning, and communication."
- src: /deck/slide-09.png
  alt: "Table extending the depth-of-position framework with marketing signal and business outcome rows, linking each depth to specific KPIs like aided/unaided awareness, brand preference, and new-buyer or market-share outcomes."
- src: /deck/slide-10.png
  alt: "Slide titled “Data inputs that inform the risk associated with cutting marketing spend,” outlining wire dependence, decay rate, and replacement speed, alongside an Ehrenberg-Bass Institute chart on sales decline after brands stop advertising."
- src: /deck/slide-11.png
  alt: "2x2 risk matrix titled “Budget cuts are free to finance because they consider a position to be static,” plotting brand examples like Volvo, OpenAI, Costco, Prime, Coca-Cola, and Liquid Death by category loudness and risk level."
- src: /deck/slide-12.png
  alt: "Table titled “Assessing the long-term risk of a marketing cut based on brand positioning,” classifying cuts as exit, capital (asymmetric), capital (recoverable), or cost decisions based on wire dependence, decay rate, and replacement speed."
- src: /deck/slide-13.png
  alt: "Closing slide titled “Brand positions become competitive advantages when they are well defended and cannot be easily (or cheaply) copied by rivals,” summarizing the three key takeaways of the framework."
