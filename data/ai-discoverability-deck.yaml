- src: "/decks%20for%20articles/ai%20discoverability/slide-01.png"
  alt: "Title slide for “Building AI Discoverability Capabilities Against a Moving Target”: a roadmap for strengthening a brand's presence in AI answers by folding the work into Integrated Marketing."
- src: "/decks%20for%20articles/ai%20discoverability/slide-02.png"
  alt: "Slide titled “The emergence of platforms and finite budgets requires marketers to find synergies when deploying resources across touchpoints,” listing why AI Discoverability can look like a speculative bet (dynamic adoption, changing algorithms, lack of standardized measurement, limited attribution, latency), alongside a chart showing consumer use of Claude, ChatGPT, Google Gemini, Perplexity, and Grok from 2023–2026."
- src: "/decks%20for%20articles/ai%20discoverability/slide-03.png"
  alt: "Slide titled “Folding AI Discoverability into Integrated Marketing planning reduces the risk of sunk cost,” with three points: nothing is stranded, no overclaiming, and sharper prioritization, citing Digiday/Scribewise data on marketers already carrying GEO budget."
- src: "/decks%20for%20articles/ai%20discoverability/slide-04.png"
  alt: "Diagram titled “Integrated Marketing should be responsible for AI Discoverability because it is a product of that team's work,” showing Paid, Owned, and Earned channels (SEM, creator/campaign assets, website/SEO, organic social, retailer PDPs, consumer/influencer/publisher reviews) all feeding into AI Discoverability."
- src: "/decks%20for%20articles/ai%20discoverability/slide-05.png"
  alt: "Framework table titled “Accounting for the internal and external forces that shape Generative AI adds value to the Integrated Planning process,” mapping Internal forces (accuracy & fidelity KPIs) and External forces (showing up at scale KPIs) across Planning, Programming, and Publishing in a six-step sequence."
- src: "/decks%20for%20articles/ai%20discoverability/slide-06.png"
  alt: "Slide titled “Audit what the models already say about your brand, and whether it is accurate and current,” covering representation accuracy rate, content freshness & consistency, and entity strength as internal measurement metrics."
- src: "/decks%20for%20articles/ai%20discoverability/slide-07.png"
  alt: "Slide titled “Track how brand exposure and preference change as you initiate efforts to indirectly influence the platforms,” covering Share-of-Model, prominence, and citation/source rate as external measurement metrics."
- src: "/decks%20for%20articles/ai%20discoverability/slide-08.png"
  alt: "Slide titled “Define how you want the brand to show up,” with an “audit the archives” checklist and a pyramid diagram showing brand position built up from product positions, campaign assets, website, PDP pages, earned social, and third-party reviews."
- src: "/decks%20for%20articles/ai%20discoverability/slide-09.png"
  alt: "Slide titled “Learn which AI platforms your audience uses, and the sources those platforms cite,” with a bar chart of top source share distribution across ChatGPT, Google AI, and Perplexity by domain (Aug 2024–June 2025), sourced from Profound."
- src: "/decks%20for%20articles/ai%20discoverability/slide-10.png"
  alt: "Slide titled “Let what (and how) people are searching inform your messaging strategy,” showing a TURF analysis where three audience-led messages reach 88% of switchers, versus 50% reach for the same three slots filled with brand-led messages."
- src: "/decks%20for%20articles/ai%20discoverability/slide-11.png"
  alt: "Slide titled “GEO wants specific answers to prompts; generalizations can dilute your authority,” contrasting laddering every asset to one keystone identity against the risk that machine retrieval isn't a scarce slot (cloaking risk)."
- src: "/decks%20for%20articles/ai%20discoverability/slide-12.png"
  alt: "Slide titled “Build a calendar that determines how, when, and where your brand shows up,” with five content-calendar pillars: positioning, product/service, seasonality, packaging, and offers & pricing."
- src: "/decks%20for%20articles/ai%20discoverability/slide-13.png"
  alt: "Timeline titled “Influencing AI Discoverability requires an earlier start than consumer support,” showing lead times before paid/retail/PR turn-on: positioning 12 weeks out, seasonality 10 weeks, product/service 8 weeks, packaging 6 weeks, and offers & pricing with no lead time."
- src: "/decks%20for%20articles/ai%20discoverability/slide-14.png"
  alt: "Slide titled “Learn & optimize based on announced changes and observed performance,” with three line charts of top cited domains in ChatGPT, AI Mode, and Perplexity over time, based on a Semrush study of 230K prompts."
- src: "/decks%20for%20articles/ai%20discoverability/slide-15.png"
  alt: "Matrix titled “Legal & business relationships steer platform direction,” tracking formal deals, active lawsuits, and settled disputes between AI platforms (OpenAI, Google/Gemini, Microsoft, Meta, Anthropic, and others) and news, image, and creator rights holders, updated August 2026."
- src: "/decks%20for%20articles/ai%20discoverability/slide-16.png"
  alt: "Closing slide titled “The exercise ensures AI Discoverability adds value without adding a line item,” summarizing three takeaways: the value is already banked, it can be defended on evidence, and it builds a capability rather than a campaign."
